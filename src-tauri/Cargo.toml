[package]
name = "ngodik"
version = "0.1.0"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
tauri = { version = "2.12.7", features = [] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls-no-alpn"] }
serde_json = "1"
url = "2"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security_Credentials", "Win32_System_Threading"] }
tokio = { version = "1", features = ["macros", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
httpdate = "1"
jsonschema = { version = "0.61.2", default-features = false }
sha2 = "0.11"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-clipboard-manager = "2.5.0"
zip = { version = "9.8.1", default-features = false }
tempfile = "3.27.0"
pulldown-cmark = { version = "0.13.6", default-features = false }
serde_yaml_ng = "0.10.0"
